# UniVerse inference config (320x512 model, stage 1).
# The 320x512 and 576x1024 models share this architecture; only the weights differ.
model:
  target: lvdm.models.ddpm3d.ConsistentVLDM
  params:
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: video
    cond_stage_key: caption
    cond_stage_trainable: False
    image_proj_model_trainable: True
    conditioning_key: hybrid
    image_size: [40, 64]  # latent size, 320x512 / 8
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: False
    uncond_prob: 0.00
    uncond_type: 'empty_seq'
    rand_cond_frame: true
    use_dynamic_rescale: true
    # Dynamic latent rescaling used by the DDIM sampler. The checkpoints store the resulting
    # `scale_arr` buffer (built with 0.7, inherited from the ViewCrafter initialisation),
    # which overrides this value when the weights are loaded.
    base_scale: 0.7
    fps_condition_type: 'fps'
    perframe_ae: True
    loop_video: False

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        in_channels: 10  # 4 noisy latents + 4 initial-video latents + inpainting mask + style mask
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        dropout: 0.1
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 16
        addition_attention: true
        image_cross_attention: true
        default_fs: 10
        fs_condition: true

    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    # OpenCLIP ViT-H-14 text/image towers. `version: null` skips downloading the LAION weights:
    # the UniVerse checkpoint already contains (bit-identical) CLIP weights.
    cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPEmbedder
      params:
        version: null
        freeze: true
        layer: "penultimate"

    img_cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        version: null
        freeze: true

    # Multi-input Query Transformer (MiQT): CLIP tokens of all input views -> 256 query tokens.
    image_proj_stage_config:
      target: lvdm.modules.encoders.multi_resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16
